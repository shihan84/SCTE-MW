# Flussonic Configuration Template for SCTE-35 Middleware
# Copy relevant sections to your main flussonic.conf

# Global SCTE-35 Settings
scte35_pid 500;
scte35_auto_cue_in true;
scte35_splice_immediate true;

# Stream Configurations
# Replace {stream_name} with your actual stream names

# Main Channel Stream
stream main_channel {
    # Input from SCTE-35 Middleware
    input srt://localhost:1234?streamid=stream1&pkt_size=1316;
    
    # SCTE-35 Configuration
    scte35_pid 500;
    scte35_validate true;
    scte35_log_level info;
    
    # Output to Carrier/CDN (JioTV/TataSky)
    output rtmp://carrier-ingest.example.com/live/main_channel {
        # Carrier-specific settings
        rtmp_publish_timeout 30s;
        rtmp_connect_timeout 10s;
        
        # SCTE-35 passthrough
        scte35_pass true;
        
        # Backup output
        on_error rtmp://backup-ingest.example.com/live/main_channel;
    }
    
    # Optional: Local recording with SCTE-35
    record /storage/recordings/main_channel {
        format mp4;
        scte35_record true;
        segment_duration 3600; # 1 hour segments
    }
    
    # Optional: HLS output with SCTE-35 markers
    output hls://localhost/hls/main_channel {
        scte35_hls true;
        segment_duration 6;
        playlist_length 30;
    }
}

# Secondary Channel Stream
stream secondary_channel {
    input srt://localhost:1234?streamid=stream2&pkt_size=1316;
    
    scte35_pid 500;
    scte35_validate true;
    
    output rtmp://carrier-ingest.example.com/live/secondary_channel {
        scte35_pass true;
        on_error rtmp://backup-ingest.example.com/live/secondary_channel;
    }
}

# News Channel Stream
stream news_channel {
    input srt://localhost:1234?streamid=stream3&pkt_size=1316;
    
    scte35_pid 500;
    scte35_validate true;
    
    output rtmp://carrier-ingest.example.com/live/news_channel {
        scte35_pass true;
        on_error rtmp://backup-ingest.example.com/live/news_channel;
    }
}

# Sports Channel Stream
stream sports_channel {
    input srt://localhost:1234?streamid=stream4&pkt_size=1316;
    
    scte35_pid 500;
    scte35_validate true;
    
    output rtmp://carrier-ingest.example.com/live/sports_channel {
        scte35_pass true;
        on_error rtmp://backup-ingest.example.com/live/sports_channel;
    }
}

# Additional Streams (stream5-stream8)
stream channel_5 {
    input srt://localhost:1234?streamid=stream5&pkt_size=1316;
    scte35_pid 500;
    output rtmp://carrier-ingest.example.com/live/channel_5 { scte35_pass true; }
}

stream channel_6 {
    input srt://localhost:1234?streamid=stream6&pkt_size=1316;
    scte35_pid 500;
    output rtmp://carrier-ingest.example.com/live/channel_6 { scte35_pass true; }
}

stream channel_7 {
    input srt://localhost:1234?streamid=stream7&pkt_size=1316;
    scte35_pid 500;
    output rtmp://carrier-ingest.example.com/live/channel_7 { scte35_pass true; }
}

stream channel_8 {
    input srt://localhost:1234?streamid=stream8&pkt_size=1316;
    scte35_pid 500;
    output rtmp://carrier-ingest.example.com/live/channel_8 { scte35_pass true; }
}

# Monitoring and Health Check
http {
    listen 8080;
    
    # API endpoints for monitoring
    location /api/streams {
        return 200 "application/json" streams_info();
    }
    
    location /api/scte35 {
        return 200 "application/json" scte35_info();
    }
    
    # Health check endpoint
    location /health {
        return 200 "text/plain" "OK";
    }
}

# Logging Configuration
log {
    level info;
    file /var/log/flussonic/scte35.log;
    
    # SCTE-35 specific logging
    scte35_events true;
    scte35_validation_errors true;
}

# Error Handling
on_error {
    # Restart stream on error
    restart_stream true;
    restart_delay 5s;
    max_restarts 10;
    
    # Notification (optional)
    exec "/usr/local/bin/notify-error.sh $stream $error";
}

# Performance Tuning
worker_processes auto;
worker_connections 1024;

# Memory limits
max_memory_usage 2G;
stream_memory_limit 256M;

# Network settings
tcp_nodelay on;
tcp_keepalive on;
keepalive_timeout 65;

# SRT specific settings
srt {
    latency 200;
    recv_buffer_size 1048576;
    send_buffer_size 1048576;
    connect_timeout 5000;
    peer_idle_timeout 10000;
}

# RTMP settings
rtmp {
    chunk_size 4096;
    buffer_size 1048576;
    timeout 30s;
}

# Security settings (if needed)
auth {
    # IP whitelist for SRT inputs
    allow 127.0.0.1;
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    
    # Deny all others
    deny all;
}

# Carrier-Specific Configurations

# JioTV Configuration
stream jiotv_main {
    input srt://localhost:1234?streamid=stream1&pkt_size=1316;
    
    # JioTV specific SCTE-35 settings
    scte35_pid 500;
    scte35_event_id_start 100023;
    scte35_auto_increment true;
    
    # JioTV ingest endpoint
    output rtmp://jiotv-ingest.example.com/live/channel {
        # JioTV specific parameters
        rtmp_app "live";
        rtmp_playpath "your_channel_key";
        
        # Authentication
        rtmp_auth "your_auth_token";
        
        # SCTE-35 compliance
        scte35_pass true;
        scte35_validate_before_send true;
    }
}

# TataSky Configuration
stream tatasky_main {
    input srt://localhost:1234?streamid=stream2&pkt_size=1316;
    
    # TataSky specific SCTE-35 settings
    scte35_pid 500;
    scte35_event_id_start 100023;
    scte35_auto_increment true;
    
    # TataSky ingest endpoint
    output rtmp://tatasky-ingest.example.com/live/channel {
        rtmp_app "live";
        rtmp_playpath "your_channel_key";
        rtmp_auth "your_auth_token";
        
        scte35_pass true;
        scte35_validate_before_send true;
    }
}

# Backup and Failover Configuration
cluster {
    # Primary Flussonic server
    server 192.168.1.10:8080 weight=100;
    
    # Backup Flussonic server
    server 192.168.1.11:8080 weight=50 backup;
    
    # Health check
    health_check /health interval=30s;
}

# Statistics and Monitoring
stats {
    # Enable statistics collection
    enabled true;
    
    # Statistics retention
    retention 7d;
    
    # Export to external monitoring
    export_to "http://monitoring.example.com/api/stats";
    export_interval 60s;
}

# Custom Scripts (Optional)
script {
    # Pre-stream script
    on_stream_start "/usr/local/bin/stream-start.sh $stream";
    
    # Post-stream script
    on_stream_stop "/usr/local/bin/stream-stop.sh $stream";
    
    # SCTE-35 event script
    on_scte35_event "/usr/local/bin/scte35-handler.sh $stream $event_id $command";
}

